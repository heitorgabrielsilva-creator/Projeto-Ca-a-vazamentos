<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caça Vazamentos - Solicite Atendimento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Caça Vazamentos</h1>
      <p>Localizamos e resolvemos seu vazamento com rapidez e precisão.</p>
    </header>

    <form id="leak-form">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" required placeholder="Digite seu nome">
      </div>

      <div class="form-group">
        <label for="telefone">Telefone / WhatsApp</label>
        <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
      </div>

      <div class="form-group">
        <label for="endereco">Endereço Completo</label>
        <input type="text" id="endereco" required placeholder="Rua, número, bairro e cidade">
      </div>

      <div class="form-group">
        <label for="problema">Descrição do Problema</label>
        <textarea id="problema" rows="4" required placeholder="Descreva onde está o vazamento ou os sinais observados"></textarea>
      </div>

      <button type="submit">Enviar Chamado</button>
    </form>

    <div id="mensagem-sucesso" class="hidden"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
